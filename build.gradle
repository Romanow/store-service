import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "org.jetbrains.kotlin.jvm" version "2.1.21"
    id "org.jetbrains.kotlin.kapt" version "2.1.21" apply false
    id "org.jetbrains.kotlin.plugin.jpa" version "2.1.21" apply false
    id "org.jetbrains.kotlin.plugin.spring" version "2.1.21" apply false
    id "org.jlleitschuh.gradle.ktlint" version "12.3.0" apply false
    id "org.openapi.generator" version "7.18.0" apply false
    id "org.springframework.boot" version "3.5.8" apply false
    id "com.gorylenko.gradle-git-properties" version "2.4.2" apply false
    id "com.adarshr.test-logger" version "4.0.0" apply false
    id "io.spring.dependency-management" version "1.1.7" apply false
}

ext {
    kotlinVersion = "2.1.21"
    springBootVersion = "3.5.8"
    springGatewayVersion = "4.3.3"
    springCircuitBreakerVersion = "3.3.1"
    validationApiVersion = "2.0.1.Final"
    wireMockVersion = "3.12.1"
    jwtVersion = "4.5.0"
    openApiVersion = "2.8.5"
    logbookVersion = "3.12.0"
    logstashEncoderVersion = "7.4"
    aggregatorByTagsVersion = "1.0.1"
    wireMockVersion = "3.10.0"
    postgresContainerVersion = "1.21.4"
    keycloakContainerVersion = "3.6.0"
}

subprojects { ->
    apply plugin: "idea"
    apply plugin: "java-library"
    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jlleitschuh.gradle.ktlint"
    apply plugin: "io.spring.dependency-management"

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    kotlin.compilerOptions.jvmTarget = JvmTarget.JVM_21

    repositories {
        mavenCentral()
    }

    ktlint {
        version.set("1.5.0")
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
            mavenBom "org.springframework.cloud:spring-cloud-gateway-dependencies:$springGatewayVersion"
            mavenBom "org.springframework.cloud:spring-cloud-circuitbreaker-dependencies:$springCircuitBreakerVersion"
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib"
        implementation "org.jetbrains.kotlin:kotlin-reflect"
        implementation "jakarta.validation:jakarta.validation-api"
        implementation "com.fasterxml.jackson.module:jackson-module-kotlin"
    }

    processResources {
        filesMatching(["**/properties-from-gradle.properties"]) {
            expand(project.properties)
        }
    }
}
